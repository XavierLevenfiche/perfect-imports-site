<!DOCTYPE html>
<!-- Perfect Imports — static 404 page for Cloudflare Pages. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &mdash; Perfect Imports</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/assets/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500;1,8..60,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#152a1e; --cream:#f5f1e8; --brass:#c8a86a; --brass-d:#7d612f;
    --ink:#182620; --muted:#586459;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased;
       text-rendering:optimizeLegibility;font-feature-settings:"kern" 1;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 28px;width:100%}
  header{background:var(--forest);border-bottom:1px solid rgba(214,184,119,.14)}
  .nav{height:74px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:13px;color:var(--cream)}
  .brand img{height:34px;width:auto;display:block}
  .brand b{font-family:"Source Serif 4",serif;font-size:20px;font-weight:600}
  .brand span span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.15em;
     color:rgba(245,241,232,.58);text-transform:uppercase;margin-top:2px}
  main{flex:1;display:grid;align-items:center;padding:96px 0}
  .kick{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.2em;
        text-transform:uppercase;color:var(--brass-d);font-weight:600}
  h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;
     font-size:clamp(42px,5.6vw,68px);line-height:1.06;color:var(--forest);margin:20px 0 0}
  .lead{color:var(--muted);font-size:clamp(16.5px,1.5vw,19px);max-width:52ch;margin:24px 0 34px}
  .cta{display:flex;gap:14px;flex-wrap:wrap}
  .btn{display:inline-block;font-weight:600;font-size:14.5px;padding:15px 28px;border-radius:3px;
       transition:background .18s,border-color .18s,color .18s;line-height:1}
  .btn.solid{background:var(--brass);color:var(--forest);border:1.5px solid var(--brass);font-weight:700}
  .btn.solid:hover{background:var(--brass-d);border-color:var(--brass-d);color:var(--cream)}
  .btn.ghost{background:transparent;color:var(--forest);border:1.5px solid rgba(21,42,30,.32)}
  .btn.ghost:hover{border-color:var(--forest);background:rgba(21,42,30,.045)}
  a:focus-visible{outline:2px solid var(--brass-d);outline-offset:3px;border-radius:2px}
  footer{background:var(--forest);color:rgba(245,241,232,.66);padding:32px 0;font-family:"IBM Plex Mono",monospace;
     font-size:11.5px;letter-spacing:.02em}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/">
      <img src="/assets/logo-web.png" alt="Perfect Imports">
      <span><b>Perfect Imports</b><span>LLC &middot; Fort Lauderdale, FL</span></span>
    </a>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="kick">404 &middot; Not found</p>
    <h1>Page not found.</h1>
    <p class="lead">That address does not match a page on this site.</p>
    <div class="cta">
      <a href="/" class="btn solid">Go home</a>
      <a href="/bonded-warehousing/" class="btn ghost">Bonded warehousing</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">Perfect Imports LLC &middot; 3259 SW 11th Ave, Fort Lauderdale, FL 33315</div>
</footer>
</body>
</html>
